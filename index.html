<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone Monitor</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0d1117; color:#e6edf3; margin:0; padding:20px; }
    h1 { font-size:20px; }
    .card { background:#161b22; border:1px solid #30363d; border-radius:10px; padding:16px; margin:10px 0; }
    .online { color:#3fb950; font-weight:600; }
    .offline { color:#f85149; font-weight:600; }
    .id { font-size:12px; color:#8b949e; word-break:break-all; }
    .dot { height:10px; width:10px; border-radius:50%; display:inline-block; margin-right:6px; }
  </style>
</head>
<body>
  <h1>📱 Phone Monitor — Devices</h1>
  <div id="list">Loading...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // 👇 Firebase Console → Web app se apna config yahan paste karo
    const firebaseConfig = {
      apiKey: "PASTE_YOUR_API_KEY",
      authDomain: "phonemonitor.firebaseapp.com",
      databaseURL: "https://phonemonitor-default-rtdb.firebaseio.com",
      projectId: "phonemonitor",
      storageBucket: "phonemonitor.appspot.com",
      messagingSenderId: "PASTE_SENDER_ID",
      appId: "PASTE_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    onValue(ref(db, "devices"), (snap) => {
      const data = snap.val() || {};
      const list = document.getElementById("list");
      const ids = Object.keys(data);
      if (ids.length === 0) { list.textContent = "Koi device nahi mila."; return; }

      list.innerHTML = ids.map(id => {
        const d = data[id];
        const online = d.status === "online";
        const last = d.lastSeen ? new Date(d.lastSeen).toLocaleString() : "-";
        return `<div class="card">
          <div><span class="dot ${online ? 'online' : 'offline'}" style="background:${online ? '#3fb950' : '#f85149'}"></span>
          <span class="${online ? 'online' : 'offline'}">${online ? 'ONLINE' : 'OFFLINE'}</span></div>
          <div class="id">${id}</div>
          <div>Last seen: ${last}</div>
        </div>`;
      }).join("");
    });
  </script>
</body>
</html>
